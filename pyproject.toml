[project]
name = "cocoindex-playground"
version = "0.1.0"
description = "CocoIndex playground"
requires-python = ">=3.14"
dependencies = ["cocoindex>=1.0.24", "numpy>=2.5.3", "slack-sdk>=3.44.1"]

[dependency-groups]
dev = ["mypy>=1.14", "ipykernel>=7.3.0"]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["I"]
