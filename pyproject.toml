[project]
name = "cocoindex-playground"
version = "0.1.0"
description = "CocoIndex playground"
requires-python = ">=3.14"
dependencies = [
  "aiohttp>=3.14.3",
  "anthropic>=1.8.0",
  "cocoindex[lancedb,sentence-transformers]>=1.0.24",
  "numpy>=2.5.3",
  "pyyaml>=6.0.3",
  "slack-sdk>=3.44.1",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["I"]
